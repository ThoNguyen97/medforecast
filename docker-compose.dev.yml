services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medforecast
      POSTGRES_USER: medforecast
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medforecast"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg2://medforecast:${POSTGRES_PASSWORD:-changeme}@db:5432/medforecast
      PIPELINE_DB_URL: postgresql+psycopg2://medforecast:${POSTGRES_PASSWORD:-changeme}@db:5432/medforecast
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ENVIRONMENT: development
      DEBUG: "True"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      PIPELINE_SOURCE: ${PIPELINE_SOURCE:-file}
      PIPELINE_DATA_DIR: /data
      PIPELINE_ICD_DIR: /data
      PIPELINE_SQLSERVER_CONN: ${PIPELINE_SQLSERVER_CONN:-}
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    image: node:20-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:
  frontend_node_modules: