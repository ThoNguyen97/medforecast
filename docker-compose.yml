services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medforecast
      POSTGRES_USER: medforecast
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medforecast"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://medforecast:${POSTGRES_PASSWORD:-changeme}@db:5432/medforecast
      PIPELINE_DB_URL: postgresql+psycopg2://medforecast:${POSTGRES_PASSWORD:-changeme}@db:5432/medforecast
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ENVIRONMENT: production
      DEBUG: "False"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      PIPELINE_SOURCE: ${PIPELINE_SOURCE:-file}
      PIPELINE_DATA_DIR: /data
      PIPELINE_ICD_DIR: /data
      PIPELINE_SQLSERVER_CONN: ${PIPELINE_SQLSERVER_CONN:-}
    volumes:
      - ../data:/data:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
